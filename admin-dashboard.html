<!doctype html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>Admin Dashboard | Aradhya Library</title>

<link rel="stylesheet" href="css/style.css">

<style>
.admin-container{
    max-width:1200px;
    margin:auto;
    padding:25px;
}

.admin-header{
    margin-bottom:20px;
}

.summary-box{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin-top:15px;
}

.summary-item{
    padding:12px 16px;
    background:#f5f7fa;
    border-radius:8px;
}

.admin-form{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    margin:15px 0;
}

.admin-form input{
    width:100%;
    box-sizing:border-box;
}

.save-btn,
.small-btn{
    cursor:pointer;
}

.notice{
    padding:12px;
    margin:15px 0;
    border-radius:8px;
}

.notice.success{
    background:#e8f8ee;
    color:#146c35;
}

.notice.error{
    background:#fdeaea;
    color:#a40000;
}

.student-card{
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
    padding:20px;
    margin:25px 0;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.student-top{
    display:flex;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
}

.table-wrap{
    width:100%;
    overflow-x:auto;
}

.data-table{
    width:100%;
    min-width:850px;
    border-collapse:collapse;
}

.data-table th,
.data-table td{
    border:1px solid #ddd;
    padding:9px;
    text-align:center;
}

.paid{
    color:green;
    font-weight:bold;
}

.due{
    color:red;
    font-weight:bold;
}

.open{
    color:green;
    font-weight:bold;
}

.closed{
    color:red;
    font-weight:bold;
}

.action-row{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    justify-content:center;
}

.small-btn{
    border:0;
    padding:8px 12px;
    border-radius:6px;
}

.small-btn.green{
    background:#198754;
    color:white;
}

.small-btn.red{
    background:#dc3545;
    color:white;
}

.small-btn.blue{
    background:#0d6efd;
    color:white;
}

.loading,
.empty{
    padding:30px;
    text-align:center;
}

@media(max-width:600px){
    .admin-container{
        padding:12px;
    }

    .student-card{
        padding:12px;
    }
}
</style>

</head>

<body>

<header class="navbar">

    <div class="logo">
        📚 Aradhya Library
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <span>
            Admin:
            <b id="adminName">Admin</b>
        </span>

        <button
            class="logout-btn"
            type="button"
            onclick="logoutAdmin()">

            Logout

        </button>

    </nav>

</header>

<main class="admin-container">

    <div class="admin-header">

        <h1>
            🔐 Admin Dashboard
        </h1>

        <p>
            Student, seat, monthly fee and attendance management.
        </p>

        <div class="summary-box">

            <div class="summary-item">
                👨‍🎓 Students:
                <b id="totalStudents">0</b>
            </div>

            <div class="summary-item">
                💰 Monthly Fee:
                <b>₹700</b>
            </div>

            <div class="summary-item">
                📅 Year:
                <b id="year"></b>
            </div>

        </div>

    </div>

    <div
        id="messageBox"
        class="notice"
        style="display:none">
    </div>

    <div class="admin-form">

        <div>

            <label>
                Search Student
            </label>

            <input
                id="search"
                type="text"
                placeholder="Name / enrollment / mobile">

        </div>

        <div style="display:flex;align-items:end">

            <button
                class="save-btn"
                type="button"
                onclick="loadStudents()">

                🔄 Refresh

            </button>

        </div>

    </div>

    <div id="studentsContainer">

        <div class="loading">
            ⏳ Loading students...
        </div>

    </div>

</main>

<script>

/* =====================================================
   CONFIG
===================================================== */

const API = "";

const token =
    localStorage.getItem("adminToken") || "";

const adminLoggedIn =
    localStorage.getItem("adminLoggedIn");


const months = [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December"
];


let allStudents = [];


/* =====================================================
   ADMIN CHECK
===================================================== */

if (
    adminLoggedIn !== "true" ||
    !token
) {

    window.location.replace(
        "admin-login.html"
    );

}


/* =====================================================
   ADMIN NAME
===================================================== */

document.getElementById(
    "adminName"
).textContent =
    localStorage.getItem(
        "adminUsername"
    ) || "Admin";


document.getElementById(
    "year"
).textContent =
    new Date().getFullYear();


/* =====================================================
   ESCAPE
===================================================== */

function esc(value){

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        function(ch){

            return {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[ch];

        }
    );

}


/* =====================================================
   MESSAGE
===================================================== */

function msg(
    text,
    type="success"
){

    const box =
        document.getElementById(
            "messageBox"
        );

    box.textContent = text;

    box.className =
        "notice " + type;

    box.style.display =
        "block";

    setTimeout(
        function(){

            box.style.display =
                "none";

        },
        4000
    );

}
/* =====================================================
   LOAD STUDENTS
===================================================== */

async function loadStudents(){

    const box =
        document.getElementById(
            "studentsContainer"
        );

    box.innerHTML =
        '<div class="loading">⏳ Loading students...</div>';

    try{

        const response =
            await fetch(
                API +
                "/api/admin/students",
                {
                    method:"GET",

                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const data =
            await response.json();


        if(
            response.status === 401
        ){

            logoutAdmin();
            return;

        }


        if(!response.ok){

            throw new Error(
                data.message ||
                "Students load failed."
            );

        }


        allStudents =
            data.students || [];


        document.getElementById(
            "totalStudents"
        ).textContent =
            allStudents.length;


        renderStudents();

    }
    catch(error){

        console.error(
            "LOAD ERROR:",
            error
        );

        box.innerHTML =
            '<div class="notice error">' +
            esc(error.message) +
            '</div>';

    }

}


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById("search")
    .addEventListener(
        "input",
        renderStudents
    );


/* =====================================================
   RENDER
===================================================== */

function renderStudents(){

    const query =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();


    const list =
        allStudents.filter(
            function(student){

                return [
                    student.fullName,
                    student.enrollmentNumber,
                    student.mobile
                ].some(
                    function(value){

                        return String(
                            value || ""
                        )
                        .toLowerCase()
                        .includes(query);

                    }
                );

            }
        );


    const box =
        document.getElementById(
            "studentsContainer"
        );


    if(!list.length){

        box.innerHTML =
            '<div class="empty">' +
            '📚 No students found.' +
            '</div>';

        return;

    }


    box.innerHTML =
        list
            .map(studentCard)
            .join("");

}


/* =====================================================
   STUDENT CARD
===================================================== */

function studentCard(student){

    const fees =
        student.monthlyFees || {};


    const id =
        String(student.id);


    return `

<div class="student-card">

    <div class="student-top">

        <div>

            <h2 style="color:#173f75">

                👤 ${esc(student.fullName)}

            </h2>

            <div>
                <b>Enrollment:</b>
                ${esc(student.enrollmentNumber)}
            </div>

            <div>
                <b>Mobile:</b>
                +91 ${esc(student.mobile)}
            </div>

            <div>
                <b>Address:</b>
                ${esc(student.address)}
            </div>

        </div>


        <div>

            <div class="summary-item">

                Seat:

                <b>
                    ${esc(
                        student.seatNumber ||
                        "Not Assigned"
                    )}
                </b>

            </div>


            <div
                class="summary-item"
                style="margin-top:8px">

                Admission:

                <b>
                    ${esc(
                        student.registrationDate ||
                        "-"
                    )}
                </b>

            </div>

        </div>

    </div>


    <h3 style="color:#173f75">
        ⚙️ Student Information
    </h3>


    <div class="admin-form">


        <div>

            <label>Full Name</label>

            <input
                id="name-${esc(id)}"
                value="${esc(
                    student.fullName
                )}">

        </div>


        <div>

            <label>Mobile</label>

            <input
                id="mobile-${esc(id)}"
                value="${esc(
                    student.mobile
                )}">

        </div>


        <div>

            <label>Seat Number</label>

            <input
                id="seat-${esc(id)}"
                value="${esc(
                    student.seatNumber || ""
                )}"
                placeholder="A-01">

        </div>


        <div>

            <label>Admission Date</label>

            <input
                id="date-${esc(id)}"
                type="date"
                value="${esc(
                    student.registrationDate || ""
                )}">

        </div>


        <div>

            <label>Address</label>

            <input
                id="address-${esc(id)}"
                value="${esc(
                    student.address
                )}">

        </div>


        <div
            style="
                display:flex;
                align-items:end
            ">

            <button
                class="save-btn"
                type="button"

                onclick="
                    saveStudent('${id}')
                ">

                💾 Save

            </button>

        </div>

    </div>


    <h3 style="color:#173f75">

        💰 Monthly Fees — ₹700

    </h3>


    <div class="table-wrap">

        <table class="data-table">

            <thead>

                <tr>

                    <th>Month</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Mode</th>
                    <th>Receipt</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody>

                ${months.map(
                    function(month){

                        return feeRow(
                            student,
                            month,
                            fees[month] || {}
                        );

                    }
                ).join("")}

            </tbody>

        </table>

    </div>


    <h3 style="color:#173f75">
        📍 Attendance
    </h3>


    <div id="att-${esc(id)}">

        <button
            class="small-btn blue"
            type="button"

            onclick="
                loadAttendance('${id}')
            ">

            Load Attendance

        </button>

    </div>

</div>

`;

}


/* =====================================================
   FEE ROW
===================================================== */

function feeRow(
    student,
    month,
    fee
){

    const id =
        String(student.id);


    const paid =
        String(
            fee.status || "DUE"
        ).toUpperCase() === "PAID";


    return `

<tr>

    <td>
        <b>${month}</b>
    </td>


    <td
        class="${
            paid
                ? "paid"
                : "due"
        }">

        ${
            paid
                ? "🟢 PAID"
                : "🔴 DUE"
        }

    </td>


    <td>

        ${esc(
            fee.paymentDate ||
            fee.paidDate ||
            "-"
        )}

    </td>


    <td>

        ${esc(
            fee.paymentMode ||
            "-"
        )}

    </td>


    <td>

        ${esc(
            fee.receiptNumber ||
            "-"
        )}

    </td>


    <td>

        <div class="action-row">

            <button
                class="small-btn green"
                type="button"

                onclick="
                    setFee(
                        '${id}',
                        '${month}',
                        'PAID'
                    )
                ">

                PAID

            </button>


            <button
                class="small-btn red"
                type="button"

                onclick="
                    setFee(
                        '${id}',
                        '${month}',
                        'DUE'
                    )
                ">

                DUE

            </button>


            ${
                paid
                ? `
                <button
                    class="small-btn blue"
                    type="button"

                    onclick="
                        receipt(
                            '${id}',
                            '${month}'
                        )
                    ">

                    Receipt

                </button>
                `
                : ""
            }

        </div>

    </td>

</tr>

`;

}
/* =====================================================
   SAVE STUDENT
===================================================== */

async function saveStudent(id){

    try{

        const body = {

            fullName:
                document.getElementById(
                    "name-" + id
                ).value.trim(),

            mobile:
                document.getElementById(
                    "mobile-" + id
                ).value.trim(),

            address:
                document.getElementById(
                    "address-" + id
                ).value.trim(),

            seatNumber:
                document.getElementById(
                    "seat-" + id
                ).value.trim(),

            registrationDate:
                document.getElementById(
                    "date-" + id
                ).value

        };


        const response =
            await fetch(
                API +
                "/api/admin/student/" +
                encodeURIComponent(id),
                {

                    method:"PUT",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            token
                    },

                    body:
                        JSON.stringify(body)

                }
            );


        const data =
            await response.json();


        if(
            response.status === 401
        ){

            logoutAdmin();
            return;

        }


        if(!response.ok){

            throw new Error(
                data.message ||
                data.error ||
                "Student save failed."
            );

        }


        msg(
            "✅ Student details saved successfully.",
            "success"
        );


        await loadStudents();

    }
    catch(error){

        console.error(
            "SAVE STUDENT ERROR:",
            error
        );

        msg(
            "❌ Save failed: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   SET FEE
===================================================== */

async function setFee(
    id,
    month,
    status
){

    const student =
        allStudents.find(
            function(item){

                return String(item.id) ===
                    String(id);

            }
        );


    if(!student){

        msg(
            "Student not found.",
            "error"
        );

        return;

    }


    const fees =
        student.monthlyFees || {};


    const oldFee =
        fees[month] || {};


    const amount =
        Number(
            oldFee.amount ?? 700
        );


    let paymentMode = "";


    if(status === "PAID"){

        paymentMode =
            prompt(
                "Payment Mode:\n\nCash ya Online",
                "Cash"
            );


        if(!paymentMode){

            return;

        }


        paymentMode =
            paymentMode.trim();


        if(
            paymentMode.toLowerCase() !== "cash" &&
            paymentMode.toLowerCase() !== "online"
        ){

            alert(
                "Sirf Cash ya Online enter karo."
            );

            return;

        }


        paymentMode =
            paymentMode.toLowerCase() === "cash"
                ? "Cash"
                : "Online";

    }


    const today =
        new Date()
            .toLocaleDateString(
                "en-CA",
                {
                    timeZone:"Asia/Kolkata"
                }
            );


    const ok =
        confirm(
            status === "PAID"

            ? "Fee PAID karni hai?\n\n" +
              "Month: " + month +
              "\nAmount: ₹" + amount +
              "\nMode: " + paymentMode

            : month +
              " ki fee DUE karni hai?"
        );


    if(!ok){

        return;

    }


    const body = {

        status:status,

        amount:amount,

        paymentDate:
            status === "PAID"
                ? today
                : "",

        paymentMode:
            status === "PAID"
                ? paymentMode
                : "",

        receiptNumber:
            status === "PAID"
                ? (
                    oldFee.receiptNumber ||
                    makeReceiptNumber(
                        student,
                        month
                    )
                )
                : ""

    };


    try{

        const year =
            new Date()
                .getFullYear();


        const response =
            await fetch(
                API +
                "/api/admin/student/" +
                encodeURIComponent(id) +
                "/fee/" +
                year +
                "/" +
                encodeURIComponent(month),
                {

                    method:"PUT",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            token
                    },

                    body:
                        JSON.stringify(body)

                }
            );


        const data =
            await response.json();


        if(
            response.status === 401
        ){

            logoutAdmin();
            return;

        }


        if(!response.ok){

            throw new Error(
                data.message ||
                data.error ||
                "Fee update failed."
            );

        }


        msg(
            "✅ " +
            month +
            " " +
            year +
            " marked " +
            status +
            ".",
            "success"
        );


        await loadStudents();

    }
    catch(error){

        console.error(
            "FEE ERROR:",
            error
        );

        msg(
            "❌ Fee update failed: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   RECEIPT NUMBER
===================================================== */

function makeReceiptNumber(
    student,
    month
){

    const year =
        new Date()
            .getFullYear();


    const random =
        Math.floor(
            1000 +
            Math.random() * 9000
        );


    return (
        "AR-" +
        year +
        "-" +
        random
    );

}
/* =====================================================
   RECEIPT
===================================================== */

function receipt(
    id,
    month
){

    const student =
        allStudents.find(
            function(item){

                return String(item.id) ===
                    String(id);

            }
        );


    if(!student){

        alert(
            "Student not found."
        );

        return;

    }


    const year =
        new Date()
            .getFullYear();


    const url =
        API +
        "/api/receipt/" +
        encodeURIComponent(
            student.enrollmentNumber
        ) +
        "/" +
        year +
        "/" +
        encodeURIComponent(month);


    window.open(
        url,
        "_blank"
    );

}


/* =====================================================
   LOAD ATTENDANCE
===================================================== */

async function loadAttendance(id){

    const box =
        document.getElementById(
            "att-" + id
        );


    box.innerHTML =
        "<p>⏳ Loading attendance...</p>";


    try{

        const year =
            new Date()
                .getFullYear();


        const response =
            await fetch(
                API +
                "/api/admin/student/" +
                encodeURIComponent(id) +
                "/attendance/" +
                year,
                {

                    method:"GET",

                    headers:{
                        "Authorization":
                            "Bearer " +
                            token
                    }

                }
            );


        const data =
            await response.json();


        if(
            response.status === 401
        ){

            logoutAdmin();
            return;

        }


        if(!response.ok){

            throw new Error(
                data.message ||
                "Attendance load failed."
            );

        }


        const attendance =
            data.attendance || {};


        const rows =
            Object.values(
                attendance
            )
            .sort(
                function(a,b){

                    return String(
                        b.date || ""
                    ).localeCompare(
                        String(
                            a.date || ""
                        )
                    );

                }
            );


        if(!rows.length){

            box.innerHTML =
                `
                <div class="notice">
                    No attendance records.
                </div>
                `;

            return;

        }


        box.innerHTML = `

<div class="table-wrap">

<table class="data-table">

<thead>

<tr>

<th>Date</th>
<th>IN</th>
<th>OUT</th>

</tr>

</thead>

<tbody>

${
    rows.map(
        function(row){

            return `

<tr>

<td>
    ${esc(row.date || "-")}
</td>

<td>
    ${esc(row.inTime || "-")}
</td>

<td>
    ${esc(row.outTime || "-")}
</td>

</tr>

`;

        }
    ).join("")
}

</tbody>

</table>

</div>

`;

    }
    catch(error){

        console.error(
            "ATTENDANCE ERROR:",
            error
        );

        box.innerHTML =
            `
            <div class="notice error">
                ❌ ${esc(
                    error.message
                )}
            </div>
            `;

    }

}


/* =====================================================
   LOGOUT
===================================================== */

function logoutAdmin(){

    localStorage.removeItem(
        "adminLoggedIn"
    );

    localStorage.removeItem(
        "adminUsername"
    );

    localStorage.removeItem(
        "adminToken"
    );

    sessionStorage.clear();


    window.location.replace(
        "admin-login.html"
    );

}


/* =====================================================
   TOKEN CHECK
===================================================== */

window.addEventListener(
    "pageshow",
    function(){

        const loggedIn =
            localStorage.getItem(
                "adminLoggedIn"
            );

        const savedToken =
            localStorage.getItem(
                "adminToken"
            );


        if(
            loggedIn !== "true" ||
            !savedToken
        ){

            window.location.replace(
                "admin-login.html"
            );

        }

    }
);


/* =====================================================
   START
===================================================== */

loadStudents();

</script>

</body>

</html>
