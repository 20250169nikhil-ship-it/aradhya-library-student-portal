<!doctype html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Admin Dashboard | Aradhya Library</title>

<link rel="stylesheet" href="css/style.css">

<style>

.admin-container{
max-width:1200px;
margin:auto;
padding:25px;
}

.summary-box{
display:flex;
gap:15px;
flex-wrap:wrap;
margin:15px 0;
}

.summary-item{
padding:12px 16px;
background:#f5f7fa;
border-radius:8px;
}

.admin-form{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin:15px 0;
}

.admin-form input,
.admin-form select{
width:100%;
box-sizing:border-box;
padding:9px;
}

.student-card{
background:#fff;
border:1px solid #ddd;
border-radius:12px;
padding:20px;
margin:25px 0;
box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.student-top{
display:flex;
justify-content:space-between;
gap:20px;
flex-wrap:wrap;
}

.table-wrap{
width:100%;
overflow-x:auto;
}

.data-table{
width:100%;
min-width:1100px;
border-collapse:collapse;
}

.data-table th,
.data-table td{
border:1px solid #ddd;
padding:9px;
text-align:center;
}

.data-table input,
.data-table select{
width:100%;
box-sizing:border-box;
padding:7px;
}

.action-row{
display:flex;
gap:6px;
flex-wrap:wrap;
justify-content:center;
}

.small-btn{
border:0;
padding:8px 12px;
border-radius:6px;
cursor:pointer;
}

.green{
background:#198754;
color:white;
}

.red{
background:#dc3545;
color:white;
}

.blue{
background:#0d6efd;
color:white;
}

.orange{
background:#f59f00;
color:white;
}

.paid{
color:green;
font-weight:bold;
}

.due{
color:red;
font-weight:bold;
}

.open{
color:green;
font-weight:bold;
}

.closed{
color:red;
font-weight:bold;
}

.notice{
padding:12px;
margin:15px 0;
border-radius:8px;
}

.notice.success{
background:#e8f8ee;
color:#146c35;
}

.notice.error{
background:#fdeaea;
color:#a40000;
}

.year-box{
padding:15px;
border:1px solid #ddd;
border-radius:10px;
background:white;
margin:15px 0;
}

.year-box select{
padding:9px 12px;
border-radius:6px;
border:1px solid #bbb;
font-weight:bold;
}

.loading,
.empty{
padding:30px;
text-align:center;
}

.fee-title{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.amount-save{
display:flex;
gap:5px;
align-items:center;
}

.amount-save input{
width:100px !important;
}

@media(max-width:600px){

.admin-container{
padding:12px;
}

.student-card{
padding:12px;
}

}

</style>

</head>

Home

Admin:

<div class="summary-box">

<div class="summary-item">
💰 Fee:
<b>Editable</b>
</div>

<div class="summary-item">
📅 Year:

</div>

</div>

</div>


<div
id="messageBox"
class="notice"
style="display:none">
</div>


<div class="year-box">

<label>
<b>💰 Select Fee Year</b>
</label>

<br><br>

<select id="feeYear">

<option value="2026">
2026
</option>

<option value="2027">
2027
</option>

<option value="2028">
2028
</option>

<option value="2029">
2029
</option>

<option value="2030">
2030
</option>

</select>

<div>

<label>
Search Student

<input

placeholder="Name / enrollment / mobile">

</div>

<div class="loading">

</div>

</div>


</main>


<script>

const API="";

const token =
localStorage.getItem(
"adminToken"
) || "";

const loggedIn =
localStorage.getItem(
"adminLoggedIn"
);


const months=[

"January",
"February",
"March",
"April",
"May",
"June",
"July",
"August",
"September",
"October",
"November",
"December"

];


let allStudents=[];

let selectedFeeYear=
String(
new Date().getFullYear()
);


if(
loggedIn!=="true" ||
!token
){

location.replace(
"admin-login.html"
);

}


document.getElementById(
"adminName"
).textContent=
localStorage.getItem(
"adminUsername"
) || "Admin";


document.getElementById(
"feeYear"
).value=
selectedFeeYear;


document.getElementById(
"year"
).textContent=
selectedFeeYear;


function esc(v){

return String(
v ?? ""
).replace(
/[&<>"']/g,
c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c])
);

}


function arg(v){

return String(
v ?? ""
)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}


function msg(
text,
type="success"
){

const box=
document.getElementById(
"messageBox"
);

box.textContent=text;

box.className=
"notice "+type;

box.style.display=
"block";

setTimeout(
()=>box.style.display="none",
4000
);

}


document.getElementById(
"feeYear"
).addEventListener(
"change",
function(){

selectedFeeYear=
this.value;

document.getElementById(
"year"
).textContent=
selectedFeeYear;

renderStudents();

}
);


document.getElementById(
"search"
).addEventListener(
"input",
renderStudents
);


async function loadStudents(){

const box=
document.getElementById(
"studentsContainer"
);

box.innerHTML=
'<div class="loading">⏳ Loading students...</div>';


try{

const response=
await fetch(
API+
"/api/admin/students",
{
headers:{
"Authorization":
"Bearer "+token
}
}
);


const data=
await response.json();


if(
response.status===401
){

logoutAdmin();
return;

}


if(!response.ok){

throw new Error(
data.message ||
"Students load failed."
);

}


allStudents=
data.students || [];


document.getElementById(
"totalStudents"
).textContent=
allStudents.length;


renderStudents();

}
catch(error){

console.error(error);

box.innerHTML=
'<div class="notice error">'+
esc(error.message)+
'</div>';

}

}


function getFees(
student,
year
){

if(
student.feesByYear &&
student.feesByYear[year]
){

return student.feesByYear[year];

}


if(
year==="2026" &&
student.monthlyFees
){

return student.monthlyFees;

}


return {};

}


function renderStudents(){

const query=
document.getElementById(
"search"
).value
.trim()
.toLowerCase();


const list=
allStudents.filter(
student=>[

student.fullName,
student.enrollmentNumber,
student.mobile

].some(
value=>
String(
value || ""
)
.toLowerCase()
.includes(query)
)
);


const box=
document.getElementById(
"studentsContainer"
);


if(!list.length){

box.innerHTML=
'<div class="empty">'+
'📚 No students found.'+
'</div>';

return;

}


box.innerHTML=
list
.map(studentCard)
.join("");

}

const fees=

selectedFeeYear
);


return `

<h2 style="color:#173f75">
👤 ${esc(student.fullName)}
</h2>

<b>Enrollment:</b>
${esc(student.enrollmentNumber)}
</div>

<div>
<b>Mobile:</b>
+91 ${esc(student.mobile)}
</div>

<div>
<b>Address:</b>
${esc(student.address)}
</div>

</div>


<div>

<div class="summary-item">

Seat:
<b>
${esc(
student.seatNumber ||
"Not Assigned"

</b>

</div>

<div
class="summary-item"
style="margin-top:8px">

Admission:
<b>
${esc(
student.registrationDate ||
"-"

</b>

</div>

</div>

</div>


<h3 style="color:#173f75">
⚙️ Student Information
</h3>


<div class="admin-form">

<div>

<label>Full Name</label>

<input
id="name-${esc(id)}"
value="${esc(

)}">

</div>


<div>

<label>Mobile</label>

<input
id="mobile-${esc(id)}"
value="${esc(
student.mobile
)}">

</div>


<div>

<label>Seat Number</label>

<input
id="seat-${esc(id)}"
value="${esc(
student.seatNumber || ""
)}"
placeholder="A-01">

</div>


<div>

<label>Admission Date</label>

<input
id="date-${esc(id)}"
type="date"
value="${esc(
student.registrationDate || ""
)}">

</div>

<label>Address</label>

<input
id="address-${esc(id)}"
value="${esc(
student.address || ""
)}">

</div>


<div
style="display:flex;align-items:end">

<button
class="save-btn"
onclick="saveStudent('${arg(id)}')">

💾 Save

</button>

</div>

</div>
<h3 style="color:#173f75">

💰 Monthly Fees —

</h3>


<div class="fee-title">

</div>


<div class="table-wrap">

700
);

String(

"DUE"
).toUpperCase();

async function saveStudent(id){

try{

const body={

fullName:
document.getElementById(
"name-"+id
).value.trim(),

mobile:
document.getElementById(
"mobile-"+id
).value.trim(),

address:
document.getElementById(
"address-"+id
).value.trim(),

seatNumber:
document.getElementById(
"seat-"+id
).value.trim(),

registrationDate:
document.getElementById(
"date-"+id
).value

};


const response=
await fetch(
API+
"/api/admin/student/"+
encodeURIComponent(id),
{

method:"PUT",

headers:{

"Content-Type":
"application/json",

"Authorization":
"Bearer "+token

},

body:
JSON.stringify(body)

}
);


const data=
await response.json();


if(
response.status===401
){

logoutAdmin();
return;

}


if(!response.ok){

throw new Error(
data.message ||
data.error ||
"Student save failed."
);

}


msg(
"✅ Student details saved."
);

await loadStudents();

}
catch(error){

msg(
"❌ "+error.message,
"error"
);

}

}


async function updateFee(
id,
month,
extra
){

const student=
allStudents.find(
s=>
String(s.id)===
String(id)
);


if(!student){

throw new Error(
"Student not found."
);

}


const fees=
getFees(
student,
selectedFeeYear
);


const oldFee=
fees[month] || {};


const body={

year:
selectedFeeYear,

month:
month,

amount:
Number(
extra.amount ??
oldFee.amount ??
700
),

status:
extra.status ??
oldFee.status ??
"DUE",

paymentDate:
extra.paymentDate ??
oldFee.paymentDate ??
oldFee.paidDate ??
"",

paymentMode:
extra.paymentMode ??
oldFee.paymentMode ??
"",

receiptNumber:
extra.receiptNumber ??
oldFee.receiptNumber ??
"",

admissionStatus:
extra.admissionStatus ??
oldFee.admissionStatus ??
"OPEN"

};


const response=
await fetch(
API+
"/api/admin/students/"+
encodeURIComponent(id)+
"/fee",
{

method:"PATCH",

headers:{

"Content-Type":
"application/json",

"Authorization":
"Bearer "+token

},

body:
JSON.stringify(body)

}
);


const data=
await response.json();


if(
response.status===401
){

logoutAdmin();
return null;

}


if(!response.ok){

throw new Error(
data.message ||
data.error ||
"Fee update failed."
);

}


return data;

}


async function saveAmount(
id,
month
){

try{

const input=
document.getElementById(
"amount-"+id+"-"+month
);


const amount=
Number(
input.value
);


if(
!Number.isFinite(amount) ||
amount<0
){

msg(
"❌ Valid amount enter karo.",
"error"
);

return;

}


await updateFee(
id,
month,
{
amount:amount
}
);


msg(
"✅ "+
month+
" "+selectedFeeYear+
" fee ₹"+
amount+
" saved."
);


await loadStudents();

}
catch(error){

console.error(error);

msg(
"❌ Fee save failed: "+
error.message,
"error"
);

}

}
async function setFee(
id,
month,
status
){

try{

const student=
allStudents.find(
s=>
String(s.id)===
String(id)
);


if(!student){

throw new Error(
"Student not found."
);

}


const fees=
getFees(
student,
selectedFeeYear
);


const oldFee=
fees[month] || {};


const amount=
Number(
oldFee.amount ??
700
);


let paymentMode="";


let paymentDate="";


if(status==="PAID"){

paymentMode=
prompt(
"Payment Mode:\n\nCash ya Online",
oldFee.paymentMode ||
"Cash"
);


if(!paymentMode){

return;

}


paymentMode=
paymentMode.trim();


if(
paymentMode.toLowerCase()!=="cash" &&
paymentMode.toLowerCase()!=="online"
){

alert(
"Sirf Cash ya Online enter karo."
);

return;

}


paymentMode=
paymentMode.toLowerCase()==="cash"
? "Cash"
: "Online";


paymentDate=
new Date()
.toLocaleDateString(
"en-CA",
{
timeZone:
"Asia/Kolkata"
}
);


const ok=
confirm(

"Fee PAID karni hai?\n\n"+
"Year: "+selectedFeeYear+
"\nMonth: "+month+
"\nAmount: ₹"+amount+
"\nMode: "+paymentMode

);


if(!ok){

return;

}

}else{

const ok=
confirm(

month+
" "+
selectedFeeYear+
" ki fee DUE karni hai?"

);


if(!ok){

return;

}

}


await updateFee(
id,
month,
{

amount:amount,

status:status,

paymentDate:
status==="PAID"
? paymentDate
: "",

paymentMode:
status==="PAID"
? paymentMode
: ""

}
);


msg(
"✅ "+
month+
" "+
selectedFeeYear+
" marked "+
status+"."
);


await loadStudents();

}
catch(error){

console.error(
"FEE ERROR:",
error
);

msg(
"❌ Fee update failed: "+
error.message,
"error"
);

}

}

/* =========================
   RECEIPT
========================= */

async function downloadReceipt(
id,
month
){

try{

const student=
allStudents.find(
s=>
String(s.id)===
String(id)
);


if(!student){

throw new Error(
"Student not found."
);

}


const url=
API+
"/api/receipt/"+
encodeURIComponent(
student.enrollmentNumber
)+
"/"+
encodeURIComponent(
selectedFeeYear
)+
"/"+
encodeURIComponent(
month
);


const response=
await fetch(url);


if(!response.ok){

const text=
await response.text();

throw new Error(
text ||
"Receipt download failed."
);

}


const blob=
await response.blob();


if(
!blob ||
blob.size===0
){

throw new Error(
"PDF empty hai."
);

}


const blobUrl=
URL.createObjectURL(
blob
);


const a=
document.createElement("a");


a.href=
blobUrl;


a.download=
"Aradhya-Library-"+
student.enrollmentNumber+
"-"+
selectedFeeYear+
"-"+
month+
"-Receipt.pdf";


document.body.appendChild(a);

a.click();

a.remove();


setTimeout(
function(){

URL.revokeObjectURL(
blobUrl
);

},
1000
);


msg(
"✅ PDF Receipt downloaded."
);


}
catch(error){

console.error(
"RECEIPT ERROR:",
error
);

msg(
"❌ Receipt download failed: "+
error.message,
"error"
);

}

}


/* =========================
   ATTENDANCE
========================= */

async function loadAttendance(id){

const box=
document.getElementById(
"att-"+id
);


box.innerHTML=
"<p>⏳ Loading attendance...</p>";


try{

const year=
String(
new Date().getFullYear()
);


const response=
await fetch(

API+
"/api/admin/student/"+
encodeURIComponent(id)+
"/attendance/"+
year,

{

headers:{
"Authorization":
"Bearer "+token
}

}

);


const data=
await response.json();


if(
response.status===401
){

logoutAdmin();
return;

}


if(!response.ok){

throw new Error(
data.message ||
"Attendance load failed."
);

}


const attendance=
data.attendance || {};


const rows=
Object.values(
attendance
)
.sort(
(a,b)=>
String(
b.date || ""
)
.localeCompare(
String(
a.date || ""
)
)
);


if(!rows.length){

box.innerHTML=
'<div class="notice">'+
'No attendance records.'+
'</div>';

return;

}


box.innerHTML=`

<div class="table-wrap">

<table class="data-table">

<thead>

<tr>

<th>Date</th>
<th>IN</th>
<th>OUT</th>

</tr>

</thead>

<tbody>

${
rows.map(
row=>`

<tr>

<td>
${esc(row.date || "-")}
</td>

<td>
${esc(row.inTime || "-")}
</td>

<td>
${esc(row.outTime || "-")}
</td>

</tr>

`
).join("")
}

</tbody>

</table>

</div>

`;

}
catch(error){

box.innerHTML=
'<div class="notice error">'+
esc(error.message)+
'</div>';

}

}


/* =========================
   LOGOUT
========================= */

function logoutAdmin(){

localStorage.removeItem(
"adminLoggedIn"
);

localStorage.removeItem(
"adminUsername"
);

localStorage.removeItem(
"adminToken"
);

sessionStorage.clear();

location.replace(
"admin-login.html"
);


}


/* =========================
   PAGE CHECK
========================= */

window.addEventListener(
"pageshow",
function(){

if(
localStorage.getItem(
"adminLoggedIn"
)!=="true" ||
!localStorage.getItem(
"adminToken"
)
){

location.replace(
"admin-login.html"
);

}

}
);


loadStudents();

</script>
