<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Aradhya Library</title>

    <link
        rel="stylesheet"
        href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        📚 Aradhya Library
    </div>

    <nav>
        <a href="index.html">Home</a>

        <a href="login.html">
            Student Login
        </a>

        <a href="register.html">
            Join Library
        </a>
    </nav>

</header>


<section class="registration-section">

    <div class="registration-card">

        <div class="registration-header">

            <div class="registration-icon">
                🔐
            </div>

            <h1>
                Admin Login
            </h1>

            <p>
                Manage students, seats, fees and attendance.
            </p>

        </div>


        <div
            id="messageBox"
            class="notice"
            style="display:none">
        </div>


        <form id="adminForm">

            <div class="form-group">

                <label for="username">
                    Admin ID
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter Admin ID"
                    autocomplete="username"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter admin password"
                    autocomplete="current-password"
                    required>

            </div>


            <button
                type="submit"
                class="registration-btn"
                id="btn">

                Admin Login

            </button>

        </form>


        <p class="already-member">

            Student?

            <a href="login.html">
                Student Login
            </a>

        </p>

    </div>

</section>


<footer>

    <div class="footer-logo">
        📚 Aradhya Library
    </div>

    <p>
        Library Management System
    </p>

    <p class="copyright">
        © 2026 Aradhya Library. All Rights Reserved.
    </p>

</footer>


<script>

const API =
    window.location.protocol === "file:"
        ? "http://localhost:3000"
        : "";


function message(
    text,
    type = "notice"
) {

    const box =
        document.getElementById(
            "messageBox"
        );

    box.className =
        "notice " + type;

    box.textContent = text;

    box.style.display = "block";
}


document
    .getElementById("adminForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const button =
                document.getElementById("btn");

            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;


            button.disabled = true;

            button.textContent =
                "Logging in...";


            try {

                const response =
                    await fetch(
                        API +
                        "/api/admin/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    username:
                                        username,

                                    password:
                                        password
                                })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Invalid Admin ID or Password."
                    );

                }


                /* =========================
                   SAVE ADMIN LOGIN
                ========================= */

                localStorage.setItem(
                    "adminLoggedIn",
                    "true"
                );

                localStorage.setItem(
                    "adminUsername",
                    data.username ||
                    username
                );

                localStorage.setItem(
                    "adminToken",
                    data.token || ""
                );


                /* =========================
                   OPEN DASHBOARD
                ========================= */

                window.location.replace(
                    "admin-dashboard.html"
                );

            }

            catch (error) {

                console.error(
                    "Admin Login Error:",
                    error
                );

                message(
                    error.message ||
                    "Admin login failed.",
                    "error"
                );

                button.disabled = false;

                button.textContent =
                    "Admin Login";
            }

        }
    );

</script>


<script src="js/app.js"></script>

</body>

</html>
