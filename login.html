```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aradhya Library - Student Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<header class="navbar">

    <div class="logo">
        📚 Aradhya Library
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="register.html">
            Join Library
        </a>

    </nav>

</header>


<section class="registration-section">

    <div class="registration-card">

        <div class="registration-header">

            <div class="registration-icon">
                🔐
            </div>

            <h1>
                Student Login
            </h1>

            <p>
                Login using your Enrollment Number and Password.
            </p>

        </div>


        <form id="loginForm">


            <div class="form-group">

                <label for="enrollment">
                    Enrollment Number
                </label>

                <input
                    type="text"
                    id="enrollment"
                    placeholder="Example: AR2026526399"
                    maxlength="30"
                    required>

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required>

            </div>


            <button
                type="submit"
                class="registration-btn"
                id="loginBtn">

                Login

            </button>


            <p class="already-member">

                New student?

                <a href="register.html">
                    Create Account
                </a>

            </p>


        </form>

    </div>

</section>


<footer>

    <div class="footer-logo">
        📚 Aradhya Library
    </div>

    <p>
        Library Management System
    </p>

    <p class="copyright">
        © 2026 Aradhya Library. All Rights Reserved.
    </p>

</footer>


<script>

const loginForm =
    document.getElementById("loginForm");

const loginBtn =
    document.getElementById("loginBtn");


loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();


    const enrollment =
        document
        .getElementById("enrollment")
        .value
        .trim();


    const password =
        document
        .getElementById("loginPassword")
        .value;


    if (!enrollment || !password) {

        alert(
            "Please enter Enrollment Number and Password."
        );

        return;
    }


    loginBtn.disabled = true;
    loginBtn.innerText = "Logging in...";


    try {

        const response = await fetch(
            "https://aradhya-library-student-portal-5.onrender.com/api/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    enrollmentNumber:
                        enrollment,

                    password:
                        password

                })
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Invalid Enrollment Number or Password."
            );

            loginBtn.disabled = false;
            loginBtn.innerText = "Login";

            return;
        }


        // Save logged-in student
        localStorage.setItem(
            "currentStudent",
            JSON.stringify(data.student)
        );


        alert(
            "Login Successful!\n\n" +
            "Welcome " +
            data.student.fullName
        );


        window.location.href =
            "student-dashboard.html";


    } catch (error) {

        console.error(error);

        alert(
            "Backend server se connection nahi ho pa raha.\n\n" +
            "Please make sure node server.js is running."
        );

        loginBtn.disabled = false;
        loginBtn.innerText = "Login";

    }

});

</script>


</body>

</html>
```
