<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Login | Aradhya Library</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">📚 Aradhya Library</div>

    <nav>
      <a href="index.html">Home</a>
      <a href="register.html">Join Library</a>
      <a class="admin-btn" href="admin-login.html">Admin Login</a>
    </nav>
  </header>


  <!-- Student Login -->
  <section class="registration-section">

    <div class="registration-card">

      <div class="registration-header">
        <div class="registration-icon">🔐</div>

        <h1>Student Login</h1>

        <p>
          Login using your Enrollment Number and Password.
        </p>
      </div>


      <!-- Message Box -->
      <div
        id="messageBox"
        class="notice"
        style="display:none"
      ></div>


      <!-- Login Form -->
      <form id="loginForm">

        <div class="form-group">

          <label for="enrollment">
            Enrollment Number
          </label>

          <input
            id="enrollment"
            type="text"
            placeholder="Example: AR20260001"
            autocomplete="username"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          type="submit"
          class="registration-btn"
          id="loginBtn"
        >
          Login
        </button>

      </form>


      <p class="already-member">
        New student?
        <a href="register.html">Create Account</a>
      </p>

    </div>

  </section>


  <!-- Footer -->
  <footer>

    <div class="footer-logo">
      📚 Aradhya Library
    </div>

    <p>
      Library Management System
    </p>

  </footer>


  <!-- Shared JavaScript -->
  <script src="js/app.js"></script>


  <!-- Login JavaScript -->
  <script>

    document
      .getElementById("loginForm")
      .addEventListener("submit", async function (e) {

        e.preventDefault();

        const btn = document.getElementById("loginBtn");

        const enrollmentInput =
          document.getElementById("enrollment");

        const passwordInput =
          document.getElementById("password");


        const enrollmentNumber =
          enrollmentInput.value
            .trim()
            .toUpperCase();

        const password =
          passwordInput.value;


        if (!enrollmentNumber || !password) {
          showMessage(
            "Please enter Enrollment Number and Password.",
            "error"
          );
          return;
        }


        btn.disabled = true;
        btn.textContent = "Logging in...";


        try {

          const response = await fetch(
            API + "/api/login",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                enrollmentNumber: enrollmentNumber,
                password: password
              })
            }
          );


          const data = await response.json();


          if (!response.ok) {

            throw new Error(
              data.message || "Login failed."
            );

          }


          /*
           * Save logged-in student's public data
           */
          localStorage.setItem(
            "currentStudent",
            JSON.stringify(data.student)
          );


          /*
           * Redirect to Student Dashboard
           */
          window.location.href =
            "student-dashboard.html";


        } catch (error) {

          showMessage(
            error.message ||
            "Unable to login. Please try again.",
            "error"
          );

          btn.disabled = false;
          btn.textContent = "Login";

        }

      });

  </script>

</body>
</html>
